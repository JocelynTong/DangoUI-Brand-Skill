<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Brand Skill：从断点到闭环</title>
  <style>
    :root{color-scheme:light;--bg:#f5f7fb;--ink:#172033;--muted:#667085;--line:#d7deea;--panel:#fff;--blue:#3568ff;--blue-soft:#eaf0ff;--amber:#b76b00;--amber-soft:#fff3db;--green:#087a55;--green-soft:#e7f8f1;--red:#b42318;--red-soft:#ffebe9;--shadow:0 14px 36px rgba(28,39,64,.10)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#e9efff 0,transparent 30%),var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.app{max-width:1240px;margin:auto;padding:28px 24px 48px}.head{display:flex;gap:24px;justify-content:space-between;align-items:end;margin-bottom:22px}.head h1{margin:0;font-size:28px;letter-spacing:-.5px}.head p{margin:7px 0 0;color:var(--muted)}.switch{display:flex;background:#e8edf6;padding:4px;border-radius:12px}.switch button{border:0;background:transparent;padding:8px 14px;border-radius:9px;color:var(--muted);cursor:pointer}.switch button.active{background:var(--panel);color:var(--ink);box-shadow:0 2px 8px rgba(28,39,64,.1)}.legend{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}.flow{position:relative;background:rgba(255,255,255,.78);border:1px solid rgba(215,222,234,.9);border-radius:20px;padding:22px;box-shadow:var(--shadow);overflow:hidden}.lane{display:grid;grid-template-columns:repeat(4,minmax(145px,1fr));gap:34px 24px;position:relative}.node{position:relative;min-height:118px;padding:15px;border:1px solid var(--line);border-radius:15px;background:var(--panel);cursor:pointer;text-align:left;transition:.18s ease;box-shadow:0 5px 16px rgba(31,45,75,.06)}.node:hover,.node.active{transform:translateY(-2px);border-color:var(--blue);box-shadow:0 9px 24px rgba(53,104,255,.14)}.node .step{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.node h2{font-size:15px;margin:5px 0 6px}.node p{font-size:12px;color:var(--muted);margin:0}.node .state{display:inline-block;margin-top:10px;padding:3px 7px;border-radius:99px;font-size:11px}.node.done .state{background:var(--green-soft);color:var(--green)}.node.partial .state{background:var(--amber-soft);color:var(--amber)}.node::after{content:"→";position:absolute;right:-21px;top:43%;color:#8b98ad;font-size:20px}.node:nth-child(4)::after{content:"↓";right:48%;top:auto;bottom:-31px}.node:nth-child(5){grid-column:4}.node:nth-child(6){grid-column:3;grid-row:2}.node:nth-child(7){grid-column:2;grid-row:2}.node:nth-child(8){grid-column:1;grid-row:2}.node:nth-child(5)::after,.node:nth-child(6)::after,.node:nth-child(7)::after{content:"←";left:-21px;right:auto}.node:nth-child(8)::after{content:"↓";left:48%;top:auto;bottom:-31px}.node:nth-child(9){grid-column:1;grid-row:3}.node:nth-child(10){grid-column:2;grid-row:3}.node:nth-child(11){grid-column:3;grid-row:3}.node:nth-child(9)::after,.node:nth-child(10)::after{content:"→"}.node:nth-child(11)::after{display:none}.node .break{position:absolute;right:10px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--red-soft);color:var(--red);display:none;align-items:center;justify-content:center;font-weight:700}.history .node.was-broken .break{display:flex}.history .node.was-broken{border-style:dashed;border-color:#e6a09a;background:linear-gradient(135deg,var(--panel),#fff7f6)}.detail{position:sticky;top:18px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.detail .kicker{color:var(--blue);font-size:12px;font-weight:700}.detail h2{font-size:20px;margin:7px 0 16px}.fact{padding:12px 0;border-top:1px solid #edf0f5}.fact:first-of-type{border-top:0}.fact b{display:block;font-size:12px;margin-bottom:3px}.fact span{color:var(--muted);font-size:13px}.gate{margin-top:14px;padding:12px;background:var(--blue-soft);border-radius:12px;color:#2447a6;font-size:12px}.foot{display:flex;justify-content:space-between;gap:20px;margin-top:16px;color:var(--muted);font-size:12px}.foot strong{color:var(--ink)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.detail{position:static}.lane{grid-template-columns:1fr}.node,.node:nth-child(n){grid-column:1;grid-row:auto}.node::after,.node:nth-child(n)::after{content:"↓";display:block;right:48%;left:auto;top:auto;bottom:-31px}.node:last-child::after{display:none}.head{align-items:start;flex-direction:column}.switch{width:100%}.switch button{flex:1}}
  </style>
</head>
<body>
  <main class="app" id="retroFlow">
    <header class="head"><div><h1>Brand Skill：从断点到闭环</h1><p>点击任一节点，查看它为什么曾经没通、靠什么转折、现在通到了哪里。</p></div><div class="switch" role="tablist" aria-label="流程视图"><button class="active" data-mode="current">当前闭环</button><button data-mode="history">历史断点</button></div></header>
    <div class="legend"><span><i class="dot" style="background:var(--green)"></i>已形成可执行闭环</span><span><i class="dot" style="background:var(--amber)"></i>已形成契约，仍需规模验证</span><span><i class="dot" style="background:var(--red)"></i>历史上曾经断裂</span></div>
    <div class="layout">
      <section class="flow" aria-label="Brand Skill 端到端流程">
        <div class="lane">
          <button class="node done was-broken active" data-id="input"><span class="break">!</span><span class="step">01 / ORCHESTRATE</span><h2>输入与模式判断</h2><p>/brand + 来源或宿主<br>learn-brand / apply-host</p><span class="state">已闭环</span></button>
          <button class="node done was-broken" data-id="reuse"><span class="break">!</span><span class="step">02 / REUSE</span><h2>Registry 与来源继承</h2><p>优先复用，保存 manifest<br>阻止存量来源漂移</p><span class="state">已闭环</span></button>
          <button class="node done was-broken" data-id="evidence"><span class="break">!</span><span class="step">03 / EVIDENCE</span><h2>视觉优先采证</h2><p>DOM、style、asset、motion<br>先看见，再回查代码</p><span class="state">已闭环</span></button>
          <button class="node partial was-broken" data-id="interpret"><span class="break">!</span><span class="step">04 / INTERPRET</span><h2>品牌语义解释</h2><p>intent、tokens、recipes<br>说明何时何地适用</p><span class="state">待规模验证</span></button>
          <button class="node done was-broken" data-id="mapping"><span class="break">!</span><span class="step">05 / CONTRACT</span><h2>DangoUI 映射</h2><p>token、组件、slot、layout<br>缺失进入 Capability Gap</p><span class="state">已闭环</span></button>
          <button class="node partial was-broken" data-id="demo"><span class="break">!</span><span class="step">06 / PROVE</span><h2>多结构 Demo</h2><p>不是展示，而是证明<br>品牌语言真的被学会</p><span class="state">待规模验证</span></button>
          <button class="node partial was-broken" data-id="host"><span class="break">!</span><span class="step">07 / ADAPT</span><h2>宿主最小应用</h2><p>保留数据、路由与效率<br>强视觉只去适合的页面</p><span class="state">待更多宿主</span></button>
          <button class="node done was-broken" data-id="qa"><span class="break">!</span><span class="step">08 / GATE</span><h2>QA / TPP 验收</h2><p>Evidence、Structure、Generative<br>浏览器、响应式、资产、交互</p><span class="state">Web 已闭环</span></button>
          <button class="node done was-broken" data-id="route"><span class="break">!</span><span class="step">09 / ROUTE</span><h2>失败回退</h2><p>补采、重解释、补能力<br>重做 Demo 或宿主适配</p><span class="state">已闭环</span></button>
          <button class="node done" data-id="decision"><span class="break">!</span><span class="step">10 / DECIDE</span><h2>阶段结论</h2><p>Orchestrator 决定<br>继续、暂停、返工或升级</p><span class="state">已闭环</span></button>
          <button class="node partial" data-id="delivery"><span class="break">!</span><span class="step">11 / DELIVER</span><h2>版本化交付</h2><p>Demo / Registry<br>或 host patch / 回退点</p><span class="state">Web MVP</span></button>
        </div>
      </section>
      <aside class="detail" aria-live="polite"><div class="kicker" id="detailStep">01 / ORCHESTRATE</div><h2 id="detailTitle">输入与模式判断</h2><div class="fact"><b>原来没通</b><span id="before"></span></div><div class="fact"><b>关键转折</b><span id="turn"></span></div><div class="fact"><b>现在通到哪</b><span id="after"></span></div><div class="fact"><b>仍然欠缺</b><span id="gap"></span></div><div class="gate" id="gate"></div></aside>
    </div>
    <footer class="foot"><span><strong>“跑通”定义：</strong>有角色、有产物、有 gate、有失败路由，且能给出诚实的阶段结论。</span><span>状态截至 2026-09-14</span></footer>
  </main>
  <script>
    const data={
      input:{step:'01 / ORCHESTRATE',title:'输入与模式判断',before:'所有目标被塞进一个长任务，主 agent 会在上下文压力下挑重点执行。',turn:'xwr 建议按目标拆角色、交付物与验收标准。',after:'Orchestrator 先判断 learn-brand 或 apply-host，再分派阶段目标。',gap:'多 subagent 自动并行尚未形成稳定生产能力。',gate:'入口 Gate：模式、来源、宿主边界和本轮目标必须明确。'},
      reuse:{step:'02 / REUSE',title:'Registry 与来源继承',before:'新增品牌走新流程，旧 Demo 更新时却像重新猜一遍，历史来源会静默消失。',turn:'Registry 上线后的存量复跑暴露 source drift。',after:'先查公共/本地 Registry，并继承 learned source manifest。',gap:'真实外部贡献量、冲突处理与长期治理尚未验证。',gate:'复用 Gate：来源 URL、版本、哈希与证据状态必须可追溯。'},
      evidence:{step:'03 / EVIDENCE',title:'视觉优先采证',before:'先抓代码、颜色和组件，再拼回品牌；信息很多，却没找到决定“像不像”的元素。',turn:'胡腾第一次讨论：视觉发现元素后再回查代码；Evidence 类似算法召回。',after:'截图、DOM、computed style、assets、motion 进入同一证据链。',gap:'陌生站点、复杂动效与反爬场景的采集稳定性仍需验证。',gate:'Evidence Gate：来源真实、关键页面齐全、资产与动效带 usage description。'},
      interpret:{step:'04 / INTERPRET',title:'品牌语义解释',before:'只有 Token 会变成 B 端换色皮肤；只抓资产又不知道该用在哪里。',turn:'品牌学习层与 DangoUI 映射层分离；资产必须说明适用场景。',after:'产出 brand intent、tokens、recipes、suitableFor / notFor。',gap:'更多品牌类型的一次解释质量与一致性尚未证明。',gate:'方向 Gate：先确认 2–3 个结构方向，再进入实现。'},
      mapping:{step:'05 / CONTRACT',title:'DangoUI 映射',before:'为了像官网而硬编码，掩盖 DangoUI 实际不存在的能力。',turn:'9 月 10 日补 runtime gate、token closure、field ownership 与 Gap intake。',after:'品牌只能改变 value；缺失能力必须登记、补齐或明确降级。',gap:'跨端 adapter 仍需要逐平台生产验证。',gate:'Capability Gate：每个视觉决定必须映射到真实 token、组件、slot 或 recipe。'},
      demo:{step:'06 / PROVE',title:'多结构 Demo',before:'预览站越来越完整，但固定模板让每个品牌都长得一样。',turn:'Demo 从最终展示改成 Generative Proof：证明规则能产生不同结构。',after:'learn-brand 用多个页面验证同一品牌语言，而不是复制一张截图。',gap:'当前公开案例数量有限，陌生品牌重复性还不够。',gate:'Demo Gate：结构不模板化，视觉特征可辨认，来源与实现可追溯。'},
      host:{step:'07 / ADAPT',title:'宿主最小应用',before:'照搬官网会把强视觉硬塞进工具页，影响原有业务效率。',turn:'xwr 讨论明确 Host Adapter 职责；胡腾第二次讨论拆清宿主层边界。',after:'只改适合的视觉层，保留内容、数据、路由、交互和回退点。',gap:'目前只有有限 H5 宿主试点，复杂真实业务仍需验证。',gate:'Host Gate：先做最小 patch；业务事实、信息效率和回退能力不可牺牲。'},
      qa:{step:'08 / GATE',title:'QA / TPP 验收',before:'build pass、DOM 正确或图片能加载曾被误认为质量通过。',turn:'ONE PIECE 与 CZN 事故证明机器通过不等于品牌学会。',after:'Evidence、Structural、Generative 三证，加真实页面、滚动、资产、交互与响应式检查。',gap:'微信开发者工具、Android、iOS 真机尚未完成生产验证。',gate:'最终 Gate：三证不可互相补偿；任一失败都必须阻断。'},
      route:{step:'09 / ROUTE',title:'失败回退',before:'失败只会继续改 CSS 或补 Prompt，不知道该回到哪里。',turn:'多角色 workflow 与六层架构共同建立责任边界。',after:'证据错回 Evidence，语义错回 Interpreter，能力缺口回 Mapping，页面问题回 Demo/Host。',gap:'需要用更多事故验证路由是否总能准确命中责任节点。',gate:'路由 Gate：失败必须包含 owner、blocking issue、修复条件和复验入口。'},
      decision:{step:'10 / DECIDE',title:'阶段结论',before:'“流程跑完”容易被写成“能力完成”，导致范围被夸大。',turn:'Orchestrator 被定义为阶段决策者，而不是另一个全能执行者。',after:'明确输出继续、暂停、返工或升级，并区分已证明与未证明。',gap:'量化的一次通过率、耗时与返工原因仍待持续采集。',gate:'Decision Gate：结论必须引用产物与验收证据。'},
      delivery:{step:'11 / DELIVER',title:'版本化交付',before:'一次 Demo 成功没有来源、规则和版本沉淀，下次仍从零开始。',turn:'公共 Registry、source manifest、host patch 与回退点被纳入交付。',after:'learn-brand 发布 Demo/Registry；apply-host 交付 patch、验收记录与回退点。',gap:'当前是 Web MVP / controlled alpha，不代表全平台成熟。',gate:'交付 Gate：来源、版本、验证记录和失败边界必须一起交付。'}
    };
    const root=document.getElementById('retroFlow');const fields=['before','turn','after','gap','gate'];
    function select(id){root.querySelectorAll('.node').forEach(n=>n.classList.toggle('active',n.dataset.id===id));const d=data[id];document.getElementById('detailStep').textContent=d.step;document.getElementById('detailTitle').textContent=d.title;fields.forEach(k=>document.getElementById(k).textContent=d[k]);}
    root.querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>select(n.dataset.id)));
    root.querySelectorAll('.switch button').forEach(b=>b.addEventListener('click',()=>{root.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('active',x===b));root.querySelector('.flow').classList.toggle('history',b.dataset.mode==='history');}));select('input');
  </script>
</body>
</html>
