<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#20242b;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.app{max-width:1320px;margin:auto;padding:28px 24px 56px}.head{padding-bottom:18px;border-bottom:1px solid #d8dce1}.head h1{margin:0 0 6px;font-size:26px}.head p{margin:0;color:#626973}.layout{display:grid;grid-template-columns:minmax(660px,820px) minmax(260px,340px);gap:34px;align-items:start;margin-top:24px}.diagram{min-width:0}.mermaid{display:flex;justify-content:center;background:#fff}.mermaid svg{width:100%!important;max-width:none!important;height:auto}.notes{border-left:1px solid #aeb4bc;padding-left:22px}.notes h2{margin:0 0 12px;font-size:16px}.note{padding:10px 0;border-top:1px solid #e2e5e9}.note:first-of-type{border-top:0}.note b{display:block;margin-bottom:3px;font-size:12px}.note p{margin:0;color:#4d545d;font-size:12px}.journal{margin:0 0 18px;padding:14px;border:1px solid #b42318}.journal h3{margin:0 0 10px;font-size:14px;color:#b42318}.journal b{display:block;margin-top:9px;font-size:12px}.journal p{margin:2px 0 0;color:#4d545d;font-size:12px}.journal[hidden]{display:none}.hotspot{cursor:pointer}.hotspot:focus{outline:none;stroke-width:3}.rule{margin-top:18px;padding:12px 0;border-top:2px solid #20242b;border-bottom:1px solid #20242b;font-size:12px}.rule strong{display:block;margin-bottom:4px}.fallback{margin-top:16px;color:#626973;font-size:12px}@media(max-width:1100px){.app{padding:20px 14px 42px}.layout{grid-template-columns:1fr}.notes{border-left:0;border-top:1px solid #aeb4bc;padding:18px 0 0}.head h1{font-size:22px}}</style></head>
<body><main class="app"><header class="head"><h1>Brand Skill：标准流程与历史断点</h1></header><div class="layout"><section class="diagram" aria-label="Brand Skill 标准计算机流程图"><svg id="flow" viewBox="0 0 940 2200" style="display:block;width:100%;height:auto;background:#fff" role="img" aria-label="Brand Skill 标准计算机流程图"></svg><p class="fallback">最终 Gate 不通过时不会直接回到最终 Gate：先定位责任阶段，完成该阶段返工和 Gate 复验，再重新进入 QA / TPP。</p></section>
<aside class="notes" aria-label="卡点解决日记" hidden><div class="journal" id="journal" aria-live="polite" hidden><h3 id="journal-title"></h3><b>当时卡在哪里</b><p id="journal-issue"></p><b>后来怎么解决</b><p id="journal-solution"></p></div></aside></div></main>
<script>
const svg=document.querySelector('#flow'),NS='http://www.w3.org/2000/svg',cx=390,side=745;
svg.innerHTML='<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#30353c"/></marker></defs>';
const journal={
'查询 Registry':['断点 03｜状态继承','新增案例有来源，但旧 Demo 更新时会失忆、失忆后发生视觉漂移。','每次开始先查询 Registry，继承 source manifest、版本与已有证据。'],
'Evidence Agent：视觉优先采证':['断点 04–05｜胡腾第一次讨论与证据缺口','先抓代码和颜色，漏掉真正决定“像不像”的视觉元素；资产抓到了也不知道用在哪里。','改成视觉优先采证，并为页面、资产、动效补来源、语义和使用场景。'],
'Brand Interpreter':['断点 06–07｜解释与方向','只有 token 换色，没有解释构图、层级、节奏和适用边界；方向未确认就钻入 CSS。','先产出 intent、recipe 与适用边界，再由 Direction Gate 确认方向。'],
'DangoUI Mapping':['断点 08–09｜能力映射','为了接近官网而硬编码，掩盖了 DangoUI 缺失的能力。','显式映射 token、component、slot 和 layout recipe；缺口必须补能力或声明降级。'],
'Demo Designer':['断点 10｜Demo 证明不足','固定模板让不同品牌最后看起来都一样。','用 2–3 个不同结构的 Demo 证明品牌语言具备生成性，而不是复刻单页。'],
'Host Adapter':['断点 10｜宿主适配','把官网强视觉硬塞进业务页，会伤害工具效率。','只做最小换肤，按业务页面强弱区分适配范围并保留回退点。'],
'QA / TPP Agent':['断点 11｜ONE PIECE / CZN','build 和 DOM 通过了，但真实页面仍可能没有学会品牌。','同时验收真实页面、响应式、资产、滚动和交互，三类证据不可互相替代。'],
'Orchestrator：形成阶段结论':['断点 12–13｜责任与结论','流程跑完曾被误写成能力已经完成，责任边界也不清楚。','明确 Skill、DangoUI、adapter、宿主和生产验收责任，并区分已证明与未证明。'],
'发布品牌能力':['断点 14｜复用与追溯','成功没有留下来源、规则和版本，下次仍从零开始。','随 Demo 发布 Registry、manifest、version 与验收证据。'],
'交付宿主变更':['断点 14｜交付与回退','宿主改动缺少验收记录与回退点，失败难以定位和恢复。','交付 patch、验收记录和 rollback point，确保可追溯、可复验、可回退。']};
const el=(n,a={})=>{const x=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);svg.append(x);return x}, line=(x1,y1,x2,y2,arrow=true)=>el('line',{x1,y1,x2,y2,stroke:'#4d545d','stroke-width':1.5,'marker-end':arrow?'url(#arrow)':''}), path=(d,arrow=true)=>el('path',{d,fill:'none',stroke:'#4d545d','stroke-width':1.5,'marker-end':arrow?'url(#arrow)':''}), label=(x,y,t,size=14,weight=400)=>{const q=el('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle','font-size':size,'font-weight':weight,fill:'#20242b','pointer-events':'none'});q.textContent=t;return q};
function showJournal(key){const [title,issue,solution]=journal[key],panel=document.querySelector('#journal');panel.closest('.notes').hidden=false;document.querySelector('#journal-title').textContent=title;document.querySelector('#journal-issue').textContent=issue;document.querySelector('#journal-solution').textContent=solution;panel.hidden=false;document.querySelectorAll('.hotspot').forEach(n=>n.setAttribute('stroke-width',n.dataset.key===key?'3':'2.2'));if(innerWidth<=1100)panel.scrollIntoView({block:'start'});}
function mark(shape,key){if(!journal[key])return;shape.setAttribute('stroke','#b42318');shape.setAttribute('stroke-width','2.2');shape.setAttribute('class','hotspot');shape.setAttribute('role','button');shape.setAttribute('tabindex','0');shape.dataset.key=key;shape.setAttribute('aria-label',`${journal[key][0]}，点击查看卡点与解决日记`);shape.addEventListener('click',()=>showJournal(key));shape.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showJournal(key)}})}
function box(x,y,w,h,lines,terminal=false){const shape=el('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:terminal?h/2:0,fill:'#fff',stroke:'#20242b','stroke-width':terminal?2:1.5});mark(shape,lines[0]);lines.forEach((t,i)=>label(x,y-(lines.length-1)*10+i*20,t,i?13:14,i?400:600));}
function diamond(x,y,w,h,lines){el('polygon',{points:`${x},${y-h/2} ${x+w/2},${y} ${x},${y+h/2} ${x-w/2},${y}`,fill:'#fff',stroke:'#20242b','stroke-width':1.6});lines.forEach((t,i)=>label(x,y-(lines.length-1)*10+i*20,t,14,600));}
function down(y1,y2,txt=''){line(cx,y1,cx,y2);if(txt)label(cx+31,(y1+y2)/2+4,txt,12)}
function fail(gateY,boxY,ownerY,ownerHalfWidth,lines,back){path(`M ${cx+95} ${gateY} H ${side-120}`);label((cx+95+side-120)/2,gateY-8,'不通过',12);box(side,boxY,240,64,lines);path(`M ${side+120} ${boxY} H 900 V ${ownerY} H ${cx+ownerHalfWidth}`);label(850,(boxY+ownerY)/2,back,12)}
box(cx,45,300,52,['开始：/brand + 品牌来源或现有项目'],true);down(71,115);diamond(cx,165,190,100,['有现有宿主项目','需要适配吗？']);
path(`M ${cx-95} 165 H 210 V 235`);label(260,151,'否：learn-brand',12);box(210,275,250,64,['查询 Registry','继承 source manifest']);
path(`M ${cx+95} 165 H 570 V 235`);label(525,151,'是：apply-host',12);box(570,275,250,64,['读取宿主基线','业务、路由、结构、回退点']);path('M 210 307 V 340 H 390',false);path('M 570 307 V 340 H 390',false);down(340,390);
box(cx,430,310,80,['Evidence Agent：视觉优先采证','截图、DOM、样式、资产、动效']);down(470,515);diamond(cx,565,190,100,['Evidence Gate','证据真实且完整？']);down(615,680,'通过');
box(cx,720,330,80,['Brand Interpreter','解释 intent、token、recipe 与适用边界']);down(760,805);diamond(cx,855,190,100,['Direction Gate','方向成立？']);down(905,970,'通过');
box(cx,1010,330,80,['DangoUI Mapping','token、component、slot、layout recipe']);down(1050,1095);diamond(cx,1145,190,100,['Capability Gate','DangoUI 能承接？']);down(1195,1240,'通过');
diamond(cx,1290,150,90,['当前模式？']);path(`M ${cx-75} 1290 H 210 V 1360`);label(245,1277,'learn-brand',12);box(210,1400,260,70,['Demo Designer','用不同结构证明品牌语言可生成']);path(`M ${cx+75} 1290 H 570 V 1360`);label(540,1277,'apply-host',12);box(570,1400,260,70,['Host Adapter','最小换肤并保留业务效率']);path('M 210 1435 V 1470 H 390',false);path('M 570 1435 V 1470 H 390',false);down(1470,1510);
box(cx,1550,330,80,['QA / TPP Agent','Evidence、Structural、Generative Proof']);down(1590,1635);diamond(cx,1685,190,100,['最终 Gate','目标达成？']);down(1735,1800,'通过');box(cx,1840,330,80,['Orchestrator：形成阶段结论','区分已证明与未证明']);down(1880,1915);diamond(cx,1960,150,80,['交付模式？']);
path(`M ${cx-75} 1960 H 230 V 2010`);label(255,1947,'learn-brand',12);box(230,2045,270,58,['发布品牌能力','Demo、Registry、manifest、version']);path(`M ${cx+75} 1960 H 550 V 2010`);label(525,1947,'apply-host',12);box(550,2045,270,58,['交付宿主变更','patch、验收记录、rollback point']);path('M 230 2074 V 2100 H 390',false);path('M 550 2074 V 2100 H 390',false);down(2100,2140);box(cx,2170,300,52,['结束：可追溯、可复验、可回退'],true);
fail(565,565,430,155,['补采页面、资产、动效语义','补充使用场景说明'],'重新采证');fail(855,855,720,165,['重做 2–3 个结构方向'],'重新解释');fail(1145,1145,1010,165,['补能力、明确降级方案','或暂停并升级'],'重验 Mapping');fail(1685,1685,1550,165,['读取 blocking issue 并定位责任阶段','完成返工及该阶段 Gate 复验'],'重新做 QA / TPP');
</script></body></html>
